# BEGIN_KITTY_THEME
# Rosé Pine Dawn
include current-theme.conf
# END_KITTY_THEME

font_family      GeistMono NFM
bold_font        auto
italic_font      auto
bold_italic_font auto

# Disable standard ligatures (liga) and contextual alternates (calt)
font_features GeistMonoNFM-Regular -liga -calt
font_features GeistMonoNFM-Bold -liga -calt
font_features GeistMonoNFM-Italic -liga -calt

map f11 toggle_fullscreen

# Font size 
font_size 14.0
