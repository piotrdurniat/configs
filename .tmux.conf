# ------------------------------------------------------------------
# Core
# ------------------------------------------------------------------
set -g mouse on
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# ------------------------------------------------------------------
# Clipboard & Images (Universal Auto-Detection)
# ------------------------------------------------------------------
set -g allow-passthrough on
# set -g visual-activity off
set -s set-clipboard on

bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

#    If tmux finds 'xclip' in your path, it overwrites the bindings above 
#    to use the Linux standard clipboard mechanism instead.
if-shell "command -v xclip" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'"

# ------------------------------------------------------------------
# Copy Mode (Vim Style)
# ------------------------------------------------------------------
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer

# ------------------------------------------------------------------
# Pane Controls
# ------------------------------------------------------------------
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key s split-window -v
bind-key v split-window -h

bind-key -r + resize-pane -U 5
bind-key -r - resize-pane -D 5
bind-key -r < resize-pane -L 5
bind-key -r > resize-pane -R 5

bind-key = select-layout tiled
bind-key _ resize-pane -Z
bind-key | resize-pane -Z

bind-key o kill-pane -a
bind-key q kill-pane
bind-key T break-pane
# bind-key w select-pane -t :.+
bind-key x swap-pane -D
bind-key + choose-buffer

bind-key J choose-window 'join-pane -h -s "%%"'

# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-fzf"
bind-key -r f neww ~/.local/bin/tmux-fzf

# ------------------------------------------------------------------
# Theme (Rose Pine)
# ------------------------------------------------------------------
set -g @rose_pine_variant 'dawn'

set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'off'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

set -g @rose_pine_only_windows 'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'on'

set -g @rose_pine_field_separator ' | '
set -g @rose_pine_session_icon ''
set -g @rose_pine_current_window_icon ''
set -g @rose_pine_folder_icon ''
set -g @rose_pine_username_icon ''
set -g @rose_pine_hostname_icon '󰒋'
set -g @rose_pine_date_time_icon '󰃰'
set -g @rose_pine_window_status_separator "  "

# ------------------------------------------------------------------
# Tmux Resurrect and Continuum settings
# ------------------------------------------------------------------
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# ------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# ------------------------------------------------------------------
# Better window names
# ------------------------------------------------------------------
set-window-option -g window-status-format \
  '#I:#W | #(~/.local/bin/tmux-short-path.sh 12 #{pane_current_path})'
set-window-option -g window-status-current-format \
  '#I:#W | #(~/.local/bin/tmux-short-path.sh 12 #{pane_current_path})'


